[workspace]
members = ["."]

[package]
name = "signkit"
version = "0.1.14"
edition = "2021"
rust-version = "1.88.0"
license = "AGPL-3.0-only"
authors = ["SignKit Authors"]
description = "Production-quality first Rust CLI slice for SignKit"

[[bin]]
name = "signkit"
path = "src/main.rs"

[lib]
name = "signkit_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "io-util", "time"] }
toml = "1.1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
tokio = { version = "1.40", features = ["full"] }
wiremock = "0.6"
