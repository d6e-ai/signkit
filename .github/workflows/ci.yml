name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: signkit_test
          POSTGRES_USER: signkit_test
          POSTGRES_PASSWORD: signkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signkit_test -d signkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgres://signkit_test:signkit_test@127.0.0.1:5432/signkit_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [node, cloudflare, vercel]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:${{ matrix.target }}
      - if: matrix.target == 'cloudflare'
        run: pnpm exec wrangler types --check src/worker-configuration.d.ts
      - if: matrix.target == 'cloudflare'
        run: pnpm exec wrangler d1 migrations apply signkit --local
      - if: matrix.target == 'cloudflare'
        run: pnpm exec wrangler deploy --dry-run
