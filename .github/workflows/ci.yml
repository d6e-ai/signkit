name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: signkit_test
          POSTGRES_USER: signkit_test
          POSTGRES_PASSWORD: signkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signkit_test -d signkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgres://signkit_test:signkit_test@127.0.0.1:5432/signkit_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply PostgreSQL migrations to a fresh PostgreSQL 18 database
        env:
          DATABASE_URL: postgres://signkit_test:signkit_test@127.0.0.1:5432/signkit_test
        run: |
          node scripts/postgres-migrate.mjs
          node scripts/postgres-migrate.mjs --check
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run build:create-signkit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [node, cloudflare, vercel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:${{ matrix.target }}
      - if: matrix.target == 'node'
        run: pnpm run test:node-build
      - if: matrix.target == 'node'
        name: Build Node Docker image
        run: docker build --tag signkit-ci:${{ github.sha }} .
      - if: matrix.target == 'cloudflare'
        run: pnpm exec wrangler types --check src/worker-configuration.d.ts
      - if: matrix.target == 'cloudflare'
        run: pnpm exec wrangler d1 migrations apply signkit --local
      - if: matrix.target == 'cloudflare'
        run: pnpm exec wrangler deploy --dry-run
      - if: matrix.target == 'cloudflare'
        run: pnpm run build:create-signkit
      - if: matrix.target == 'cloudflare'
        env:
          SIGNKIT_RELEASE_TAG: v0.0.0-ci
          GITHUB_REF_NAME: should-not-become-the-bundle-tag
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/build-cloudflare-release-bundle.mjs
      - if: matrix.target == 'cloudflare'
        env:
          SIGNKIT_RELEASE_TAG: v0.0.0-ci
          GITHUB_REF_NAME: should-not-become-the-bundle-tag
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/verify-cloudflare-release-bundle.mjs
      - if: matrix.target == 'cloudflare'
        run: rm -rf .release

  rust-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  pades-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep generated PAdES evidence outside the checkout
        run: echo "PADES_OUT=$RUNNER_TEMP/signkit-pades-conformance" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.7
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: tools/pades-conformance/uv.lock
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install the pinned PAdES fixture environment
        run: uv sync --project tools/pades-conformance --locked --python 3.12
      - name: Generate ephemeral PAdES B-B and B-T fixtures
        run: >-
          uv run --project tools/pades-conformance
          --locked
          python tools/pades-conformance/generate.py --out "$PADES_OUT"
      - name: Validate PAdES B-B and B-T with pyHanko
        run: |
          for profile in b-b b-t; do
            uv run --project tools/pades-conformance --locked pyhanko sign adesverify \
              --trust-replace \
              --trust "$PADES_OUT/trust/signer.pem" \
              --trust "$PADES_OUT/trust/tsa.pem" \
              --no-revocation-check \
              --validation-time 2026-09-23T00:00:00Z \
              --pretty-print "$PADES_OUT/pades-$profile.pdf" \
              > "$PADES_OUT/reports/pyhanko-$profile.txt"
          done
      - name: Require pyHanko to reject signed-byte mutations
        run: |
          for profile in b-b b-t; do
            report="$PADES_OUT/reports/pyhanko-tampered-$profile.txt"
            if uv run --project tools/pades-conformance --locked pyhanko sign adesverify \
              --trust-replace \
              --trust "$PADES_OUT/trust/signer.pem" \
              --trust "$PADES_OUT/trust/tsa.pem" \
              --no-revocation-check \
              --validation-time 2026-09-23T00:00:00Z \
              --pretty-print "$PADES_OUT/tampered-$profile.pdf" \
              > "$report" 2>&1; then
              echo "pyHanko accepted tampered-$profile.pdf" >&2
              exit 1
            fi
          done
      - name: Validate profiles and mutations with EU DSS 6.5
        run: >-
          mvn -B -ntp -f tools/pades-conformance/dss/pom.xml
          compile exec:java
          -Dexec.mainClass=ai.d6e.signkit.pades.DssValidate
          -Dexec.args="$PADES_OUT"
      - name: Prove uploaded paths contain no private keys
        id: pades-secret-scan
        if: always()
        run: |
          if [[ ! -d "$PADES_OUT" ]]; then
            echo "PAdES output directory was not created" >&2
            exit 1
          fi
          if find "$PADES_OUT" -type f \( \
            -iname '*.key' -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*.pkcs12' \
          \) -print -quit | grep -q .; then
            echo "Forbidden private-key file extension in PAdES artifacts" >&2
            exit 1
          fi
          if grep -RIlE 'BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY' \
            "$PADES_OUT/source.pdf" \
            "$PADES_OUT"/pades-*.pdf \
            "$PADES_OUT"/tampered-*.pdf \
            "$PADES_OUT/trust" \
            "$PADES_OUT/reports" \
            "$PADES_OUT/manifest.json" \
            "$PADES_OUT/SHA256SUMS"; then
            echo "Private-key material in PAdES artifact allowlist" >&2
            exit 1
          fi
      - name: Upload public PAdES conformance evidence
        if: always() && steps.pades-secret-scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pades-conformance-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/signkit-pades-conformance/source.pdf
            ${{ runner.temp }}/signkit-pades-conformance/pades-b-b.pdf
            ${{ runner.temp }}/signkit-pades-conformance/pades-b-t.pdf
            ${{ runner.temp }}/signkit-pades-conformance/tampered-b-b.pdf
            ${{ runner.temp }}/signkit-pades-conformance/tampered-b-t.pdf
            ${{ runner.temp }}/signkit-pades-conformance/trust/signer.pem
            ${{ runner.temp }}/signkit-pades-conformance/trust/tsa.pem
            ${{ runner.temp }}/signkit-pades-conformance/manifest.json
            ${{ runner.temp }}/signkit-pades-conformance/SHA256SUMS
            ${{ runner.temp }}/signkit-pades-conformance/reports/
