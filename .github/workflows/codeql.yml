# CodeQL for JavaScript and TypeScript. Manual only.
#
# A run on every pull request, every push to main, and every Monday used
# Actions minutes for a scan that can wait. Start it by hand:
#
#   gh workflow run codeql.yml --ref <branch>
name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
